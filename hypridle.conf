# ============================================================================
# 💤 HYPRIDLE IDLE MANAGEMENT CONFIGURATION (hypridle.conf)
# ============================================================================
# Manages power-saving triggers, automatic screen dimming, Quickshell 
# lockscreen integration, display sleep (DPMS), and system suspend timers.
# ============================================================================

general {
    lock_cmd         = /home/pradun/.config/hypr/scripts/qs_dialog.sh lockscreen open
    before_sleep_cmd = /home/pradun/.config/hypr/scripts/qs_dialog.sh lockscreen open
    after_sleep_cmd  = hyprctl dispatch dpms on
}


# ============================================================================
# 💡 1. DIM LAPTOP SCREEN (5 Minutes / 300s)
# ============================================================================
# Saves current display brightness state and dims the internal panel to 10%.
listener {
    timeout    = 300
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}


# ============================================================================
# 🔒 2. SECURE LOCKSCREEN (10 Minutes / 600s)
# ============================================================================
# Triggers your custom Quickshell lockscreen overlay prior to display sleep.
listener {
    timeout    = 600
    on-timeout = /home/pradun/.config/hypr/scripts/qs_dialog.sh lockscreen open
}


# ============================================================================
# 🖥️ 3. DISPLAY POWER MANAGEMENT / DPMS OFF (15 Minutes / 900s)
# ============================================================================
# Powers off external and internal monitor backlights to conserve power.
listener {
    timeout    = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}


# ============================================================================
# 💤 4. SYSTEM SUSPEND (30 Minutes / 1800s)
# ============================================================================
# Enters low-power system sleep mode after prolonged inactivity.
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}