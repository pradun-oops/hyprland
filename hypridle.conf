general {
    lock_cmd         = /home/pradun/.config/hypr/scripts/qs_dialog.sh lockscreen open
    before_sleep_cmd = /home/pradun/.config/hypr/scripts/qs_dialog.sh lockscreen open
    after_sleep_cmd  = hyprctl dispatch dpms on
}

listener {
    timeout    = 300
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

listener {
    timeout    = 600
    on-timeout = /home/pradun/.config/hypr/scripts/qs_dialog.sh lockscreen open
}

listener {
    timeout    = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}