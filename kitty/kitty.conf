# ==========================================================
# 🐱 Kitty Terminal Configuration (kitty.conf)
# Custom styled terminal setup with FiraCode Nerd Font,
# smooth cursor trails, blur/opacity, and powerline tabs.
# ==========================================================

# ==========================================================
# 🔤 Typography & Font Rendering
# ==========================================================
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Explicitly route private-use Nerd Font icons to dedicated symbols font
symbol_map U+e000-U+f8ff Symbols Nerd Font Mono

# ==========================================================
# 🪟 Window Geometry & Visuals
# ==========================================================
window_padding_width    20
background_opacity      0.8
background_blur         8
hide_window_decorations yes
confirm_os_window_close 0

# ==========================================================
# 📍 Cursor Dynamics & Trail Effects
# ==========================================================
cursor_shape                 beam
cursor_beam_thickness        1.5
cursor_blink_interval        0.5

# Animated cursor trail dynamics
cursor_trail                 10
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# ==========================================================
# 📜 Scrollback & History
# ==========================================================
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ==========================================================
# 🖱️ Mouse & Selection Behavior
# ==========================================================
copy_on_select        yes
strip_trailing_spaces smart
detect_urls           yes
url_style             curly
open_url_with         default
mouse_hide_wait       3.0

# ==========================================================
# ⌨️ Keybindings & Actions
# ==========================================================
# Window & tab management
map ctrl+shift+n new_window
map ctrl+t       new_tab

# Font scaling controls
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Clipboard operations
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Buffer management
map ctrl+shift+k clear_terminal scrollback active

# ==========================================================
# 📑 Tab Bar Aesthetics & Layout
# ==========================================================
tab_bar_style           powerline
tab_bar_align           left
tab_powerline_style     slanted

active_tab_font_style   bold
inactive_tab_font_style normal
tab_title_template      "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"

# ==========================================================
# 🔔 Alerts & System Bell
# ==========================================================
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes

# ==========================================================
# ⚡ Performance, Latency & Shell Integration
# ==========================================================
sync_to_monitor   yes
repaint_delay     10
input_delay       3
shell_integration enabled

# ==========================================================
# 📦 External Modular Theme & Tab Inclusions
# ==========================================================
include dank-tabs.conf
include dank-theme.conf