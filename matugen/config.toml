[config]
# This ensures Matugen updates Waypaper's daemon alongside generating colors
wallpaper_command = "swww img"

[templates.hyprland]
input_path = "~/.config/matugen/templates/colors.lua"
output_path = "~/.config/hypr/configs/colors.lua"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.qt5]
input_path = "~/.config/matugen/templates/qtct.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6]
input_path = "~/.config/matugen/templates/qtct.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"
